<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>patkany</title>
  </head>
  <body>
    <h1 class="h1 ms-3 me-3 mb-3">Villám patkányok</h1>
    <div class="ms-3 me-3 mb-3">
      <form id="form" class="form">
        <div class="mb-3">
          <label for="nameInput" class="form-label">Adja meg a patkány nevét</label>
          <input type="text" name="nameInput" id="name" required class="form-control">
        </div>
        <div class="mb-3">
          <button type="submit" class="btn btn-success">Mentés</button>
          <button class="btn btn-warning" type="button" id="export">Export</button>
        </div>
      </form>
    </div>
    <div id="cards" class="flex-wrap d-flex mb-3"></div>
    <div class="mb-3 ms-3 me-3">
      <textarea id="textarea" class="form-control" rows="3"></textarea>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
